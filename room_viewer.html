<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room Floor Plan Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0ece6;color:#333;font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:#fff;border-right:1px solid #e0d8ce;padding:14px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
.main{flex:1;overflow-y:auto;padding:16px}
.logo{font-size:15px;font-weight:700;color:#5a3e2b;display:flex;align-items:center;gap:6px}
.logo span{font-size:18px}
.fg-label{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block}
select{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:7px;font-size:12px;background:#fff;color:#333;outline:none;cursor:pointer}
select:focus{border-color:#C8A882}
.type-buttons{display:flex;gap:4px}
.type-btn{flex:1;padding:5px 2px;border:1.5px solid #ddd;border-radius:7px;font-size:11px;cursor:pointer;background:#fff;text-align:center;transition:all .15s;color:#666;font-weight:500}
.type-btn:hover{border-color:#C8A882;color:#C8A882}
.type-btn.active{background:#C8A882;border-color:#C8A882;color:#fff}
.stats{font-size:11px;color:#999;line-height:1.7;border-top:1px solid #f0e8de;padding-top:10px}
.stats b{color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.group-row{margin:4px 0 10px}
.group-title{font-size:13px;font-weight:700;color:#5a3e2b;display:flex;align-items:center;gap:7px;padding-bottom:6px;border-bottom:2px solid #e8d8c4}
.group-count{font-size:11px;color:#aaa;font-weight:400}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #ede4d8;cursor:default;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
.card-svg{background:#fdf8f3;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #f0e8de}
.card-info{padding:9px 12px 11px}
.card-header{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px}
.room-name{font-weight:600;font-size:13px;flex:1;line-height:1.3;color:#333}
.tbadge{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700;flex-shrink:0;margin-top:2px}
.tbadge-ngu{background:#e8f0fe;color:#1565c0}
.tbadge-sinh{background:#e8f5e9;color:#2e7d32}
.apt-name{font-size:10px;color:#aaa;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrics{display:flex;flex-wrap:wrap;gap:4px}
.metric{background:#f5ece0;border-radius:5px;padding:2px 8px;font-size:10px;color:#7a5c3a;font-weight:500}
.ckey{font-size:9px;color:#ccc;margin-top:5px;font-family:monospace}
.empty{text-align:center;padding:60px 20px;color:#bbb;font-size:13px}
a.coord-toggle{font-size:9px;color:#C8A882;cursor:pointer;text-decoration:none;display:inline-block;margin-top:3px}
.poly-coords{font-size:9px;font-family:monospace;color:#aaa;background:#fafafa;border-radius:5px;padding:6px;margin-top:5px;max-height:80px;overflow-y:auto;display:none;line-height:1.6;word-break:break-all}
.poly-coords.open{display:block}
.tc-panel{margin-top:6px;border-top:1px solid #f0e8de;padding-top:6px}
.tc-toggle{font-size:9px;color:#C8A882;cursor:pointer;text-decoration:none;display:inline-block}
.tc-body{display:none;margin-top:5px}
.tc-body.open{display:block}
.tc-textarea{width:100%;border:1px solid #e0d8ce;border-radius:6px;padding:6px 8px;font-size:9px;font-family:inherit;resize:vertical;min-height:70px;color:#444;background:#fdf8f3;line-height:1.5;box-sizing:border-box}
.tc-textarea:focus{outline:none;border-color:#C8A882}
.tc-actions{display:flex;gap:4px;margin-top:4px}
.tc-btn{flex:1;padding:4px 0;border:none;border-radius:6px;font-size:10px;cursor:pointer;font-weight:600;transition:background .15s}
.tc-btn-copy{background:#f0e8de;color:#7a5c3a}
.tc-btn-copy:hover{background:#e0d0bc}
.tc-btn-run{background:#C8A882;color:#fff}
.tc-btn-run:hover{background:#b8905f}
.tc-btn-run:disabled{background:#ddd;cursor:default;color:#aaa}
.tc-result{margin-top:5px;font-size:9px;border-radius:5px;padding:5px 7px;line-height:1.6;display:none;word-break:break-word}
.tc-result.show{display:block}
.tc-result.ok{background:#e8f5e9;color:#2e7d32}
.tc-result.err{background:#fce4ec;color:#b71c1c}
.tc-result.busy{background:#fff8e1;color:#e65100}
.tc-btn-reset{background:none;border:none;font-size:8px;color:#aaa;cursor:pointer;padding:0}
.tc-btn-reset:hover{color:#C8A882}
.tc-metrics{margin-top:4px;padding:5px 6px;background:#f9f6f2;border-radius:5px;border:1px solid #eee}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
  <div class="logo"><span>🏠</span>Floor Plan Viewer</div>
  <div>
    <span class="fg-label">Chung cư</span>
    <select id="bldFilter"><option value="">Tất cả chung cư</option></select>
  </div>
  <div>
    <span class="fg-label">Loại phòng</span>
    <div class="type-buttons">
      <button class="type-btn active" data-t="">Tất cả</button>
      <button class="type-btn" data-t="sinh_hoat">Sinh hoạt</button>
      <button class="type-btn" data-t="ngu">Ngủ</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</div>
<div class="main" id="main"><div class="empty">Đang tải...</div></div>
</div>

function classifyRoom(roomName, tmplName) {
  const n = (roomName||'').toLowerCase(), t = (tmplName||'').toLowerCase();
  if(n==='room'){
    if(t.includes('ngủ')||t.includes('master')) return 'ngu';
    if(t.includes('khách')) return 'sinh_hoat';
    return 'ngu';
  }
  if(n.includes('ngủ')||n.includes('master')) return 'ngu';
  if(n.includes('khách')||n.includes('bếp')||n.includes('ăn')||n.includes('sinh hoạt')||n.includes('chung')) return 'sinh_hoat';
  return 'other';
}

    const [x0,z0]=pts[i],[x1,z1]=pts[(i+1)%pts.length];
    a+=x0*z1-x1*z0;
  }
  return Math.abs(a/2);
}

function projOnSeg(px,pz,ax,az,bx,bz) {
  const dx=bx-ax,dz=bz-az,L2=dx*dx+dz*dz;
  if(L2<1e-10) return {t:0,dist:Math.hypot(px-ax,pz-az)};
  const t=Math.max(0,Math.min(1,((px-ax)*dx+(pz-az)*dz)/L2));
  return {t,dist:Math.hypot(px-(ax+t*dx),pz-(az+t*dz))};
}

function renderSVG(room, walls, objects) {
  const W=240,H=188,PAD=22;
  const poly=room.polygons;
  if(!poly||poly.length<3) return `<svg width="${W}" height="${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="11" fill="#ccc">No data</text></svg>`;
  
  const xs=poly.map(p=>p[0]),zs=poly.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs);
  const minZ=Math.min(...zs),maxZ=Math.max(...zs);
  const rX=maxX-minX||1,rZ=maxZ-minZ||1;
  const avW=W-PAD*2,avH=H-PAD*2;
  const scale=Math.min(avW/rX,avH/rZ);
  const offX=PAD+(avW-rX*scale)/2,offZ=PAD+(avH-rZ*scale)/2;
  const toS=(x,z)=>[(x-minX)*scale+offX,(z-minZ)*scale+offZ];
  
  // Build wall lookup
  const wallById={};
  walls.forEach(w=>wallById[w.id]=w);
  
  // Match openings to polygon edges
  const edgeOps=poly.map(()=>[]);
  for(const obj of objects){
    if(obj.objectRole!=='door'&&obj.objectRole!=='window') continue;
    const [px,,pz]=obj.position;
    for(let i=0;i<poly.length;i++){
      const [ax,az]=poly[i],[bx,bz]=poly[(i+1)%poly.length];
      const {t,dist}=projOnSeg(px,pz,ax,az,bx,bz);
      if(dist<0.25&&t>0.02&&t<0.98){
        edgeOps[i].push({obj,t,wallId:obj.snappedToWall});
        break;
      }
    }
  }
  
  let s=[];
  
  // Shadow drop
  s.push(`<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000018"/></filter></defs>`);
  
  // Polygon fill
  const pts=poly.map(([x,z])=>toS(x,z).map(v=>v.toFixed(1)).join(',')).join(' ');
  s.push(`<polygon points="${pts}" fill="#f7f0e8" stroke="none" filter="url(#sh)"/>`);
  
  // Edges with openings
  for(let i=0;i<poly.length;i++){
    const [ax,az]=poly[i],[bx,bz]=poly[(i+1)%poly.length];
    const wdx=bx-ax,wdz=bz-az,wL=Math.hypot(wdx,wdz);
    if(wL<1e-6) continue;
    const wDX=wdx/wL,wDZ=wdz/wL;
    const ops=[...edgeOps[i]].sort((a,b)=>a.t-b.t);
    
    if(ops.length===0){
      const [x1,y1]=toS(ax,az),[x2,y2]=toS(bx,bz);
      s.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#7a5c3a" stroke-width="2.5" stroke-linecap="square"/>`);
    } else {
      let pT=0;
      for(const {obj,t} of ops){
        const hw=obj.size[0]/(2*wL);
        const t0=Math.max(0,t-hw),t1=Math.min(1,t+hw);
        // Wall segment before opening
        if(t0>pT+1e-4){
          const [x1,y1]=toS(ax+pT*wdx,az+pT*wdz),[x2,y2]=toS(ax+t0*wdx,az+t0*wdz);
          s.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#7a5c3a" stroke-width="2.5" stroke-linecap="square"/>`);
        }
        
        const hX=ax+t0*wdx,hZ=az+t0*wdz;
        const R=Math.max(0.1,(t1-t0)*wL);
        
        if(obj.objectRole==='door'){
          // Door: gap + arc + leaf
          const [gx1,gy1]=toS(ax+t0*wdx,az+t0*wdz),[gx2,gy2]=toS(ax+t1*wdx,az+t1*wdz);
          // White gap
          s.push(`<line x1="${gx1.toFixed(1)}" y1="${gy1.toFixed(1)}" x2="${gx2.toFixed(1)}" y2="${gy2.toFixed(1)}" stroke="#fdf8f3" stroke-width="5" stroke-linecap="butt"/>`);
          
          // Swing direction from quaternion
          const [qx,qy,qz,qw]=obj.rotation||[0,0,0,1];
          const fX=2*(qx*qz+qy*qw),fZ=1-2*(qx*qx+qy*qy);
          let perpX=-wDZ,perpZ=wDX;
          if(perpX*fX+perpZ*fZ<0){perpX=-perpX;perpZ=-perpZ;}
          
          // Arc points (world → svg)
          const arcPts=[];
          const SEGS=14;
          for(let k=0;k<=SEGS;k++){
            const a=(Math.PI/2)*(k/SEGS);
            const c=Math.cos(a),sn=Math.sin(a);
            const wx=hX+(wDX*c+perpX*sn)*R,wz=hZ+(wDZ*c+perpZ*sn)*R;
            const [sx2,sy2]=toS(wx,wz);
            arcPts.push(`${sx2.toFixed(1)},${sy2.toFixed(1)}`);
          }
          // Leaf line
          const [lx,ly]=toS(hX+perpX*R,hZ+perpZ*R);
          const [hsx,hsy]=toS(hX,hZ);
          s.push(`<polyline points="${arcPts.join(' ')}" fill="none" stroke="#C8A882" stroke-width="1" stroke-dasharray="3,2"/>`);
          s.push(`<line x1="${hsx.toFixed(1)}" y1="${hsy.toFixed(1)}" x2="${lx.toFixed(1)}" y2="${ly.toFixed(1)}" stroke="#8B7355" stroke-width="1.5"/>`);
          
        } else {
          // Window: double line
          const wall=wallById[obj.snappedToWall]||{thickness:0.12};
          const off=(wall.thickness||0.12)*0.35;
          const perpX=-wDZ,perpZ=wDX;
          const [l1x1,l1y1]=toS(ax+t0*wdx+perpX*off,az+t0*wdz+perpZ*off);
          const [l1x2,l1y2]=toS(ax+t1*wdx+perpX*off,az+t1*wdz+perpZ*off);
          const [l2x1,l2y1]=toS(ax+t0*wdx-perpX*off,az+t0*wdz-perpZ*off);
          const [l2x2,l2y2]=toS(ax+t1*wdx-perpX*off,az+t1*wdz-perpZ*off);
          // White fill
          s.push(`<polygon points="${l1x1.toFixed(1)},${l1y1.toFixed(1)} ${l1x2.toFixed(1)},${l1y2.toFixed(1)} ${l2x2.toFixed(1)},${l2y2.toFixed(1)} ${l2x1.toFixed(1)},${l2y1.toFixed(1)}" fill="#e8f4ff" stroke="none"/>`);
          s.push(`<line x1="${l1x1.toFixed(1)}" y1="${l1y1.toFixed(1)}" x2="${l1x2.toFixed(1)}" y2="${l1y2.toFixed(1)}" stroke="#5b9bd5" stroke-width="1.2"/>`);
          s.push(`<line x1="${l2x1.toFixed(1)}" y1="${l2y1.toFixed(1)}" x2="${l2x2.toFixed(1)}" y2="${l2y2.toFixed(1)}" stroke="#5b9bd5" stroke-width="1.2"/>`);
        }
        pT=t1;
      }
      // Remaining wall
      if(pT<1-1e-4){
        const [x1,y1]=toS(ax+pT*wdx,az+pT*wdz),[x2,y2]=toS(bx,bz);
        s.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#7a5c3a" stroke-width="2.5" stroke-linecap="square"/>`);
      }
    }
  }
  
  // Polygon outline (top layer)
  s.push(`<polygon points="${pts}" fill="none" stroke="#7a5c3a" stroke-width="1" stroke-linejoin="round" opacity=".3"/>`);
  
  // Dimension label
  const wm=(maxX-minX).toFixed(2),dm=(maxZ-minZ).toFixed(2);
  s.push(`<text x="${W/2}" y="${H-5}" text-anchor="middle" font-size="8.5" fill="#bbb" font-family="monospace">${wm} × ${dm} m</text>`);
  
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${s.join('')}</svg>`;
}

// Canonical key for deduplication — round to 3dp to absorb float noise
function polyKey(pts) {
  return pts.map(([x,z])=>`${Math.round(x*1000)/1000},${Math.round(z*1000)/1000}`).join('|');
}

      <div id="${uid}" class="poly-coords">${coordStr}</div>
      ${tcPanel}

  </div>`;

// Pre-compute dupCount for all (type, polyKey) combos — O(n) instead of O(n²) per render
function buildDupMap() {
  const map={};
  for(const d of DATA.designs){
    for(const r of d.rooms){
      const type=classifyRoom(r.name,d.name);
      if(type==='other') continue;
      const k=type+'|'+polyKey(r.polygons);
      map[k]=(map[k]||0)+1;
    }
  }
  return map;
}

const TC_UID_MAP={};
const DUP_MAP=buildDupMap();

function countUnique(type) {
  const seen=new Set();
  for(const d of DATA.designs){
    if(activeBld&&d.buildingId!==activeBld) continue;
    for(const r of d.rooms){
      const t=classifyRoom(r.name,d.name);
      if(type!==''&&t!==type) continue;
      if(t==='other') continue;
      seen.add(polyKey(r.polygons));
    }
  }
  return seen.size;
}

const _tcSaveTimers={};
function autoSaveTc(uid) {
  clearTimeout(_tcSaveTimers[uid]);
  _tcSaveTimers[uid]=setTimeout(()=>{
    const tcKey=TC_UID_MAP[uid];
    const val=document.getElementById(uid+'_txt').value;
    localStorage.setItem('tc_desc_'+tcKey, val);
    const ind=document.getElementById(uid+'_saved');
    if(ind){ind.textContent='✅ đã lưu';setTimeout(()=>ind.textContent='',2000);}
  }, 600);
}

function resetTc(uid) {
  const tcKey=TC_UID_MAP[uid];
  if(!confirm('Đặt lại về mô tả gốc?')) return;
  localStorage.removeItem('tc_desc_'+tcKey);
  const el=document.getElementById(uid+'_txt');
  if(el) el.value=TEST_CASES[tcKey].description;
  const ind=document.getElementById(uid+'_saved');
  if(ind){ind.textContent='↩ đã reset';setTimeout(()=>ind.textContent='',2000);}
}

const _tcExpSaveTimers={};
function autoSaveTcExp(uid) {
  clearTimeout(_tcExpSaveTimers[uid]);
  _tcExpSaveTimers[uid]=setTimeout(()=>{
    const tcKey=TC_UID_MAP[uid];
    const val=document.getElementById(uid+'_exp').value;
    const ind=document.getElementById(uid+'_exp_saved');
    try { JSON.parse(val); } catch(e) {
      if(ind) ind.textContent='❌ JSON không hợp lệ'; return;
    }
    localStorage.setItem('tc_expected_'+tcKey, val);
    if(ind){ind.textContent='✅ đã lưu';setTimeout(()=>ind.textContent='',2000);}
  }, 600);
}

function resetTcExp(uid) {
  const tcKey=TC_UID_MAP[uid];
  if(!confirm('Đặt lại expected về mặc định?')) return;
  localStorage.removeItem('tc_expected_'+tcKey);
  const el=document.getElementById(uid+'_exp');
  if(el) el.value=JSON.stringify(TEST_CASES[tcKey].expected||{}, null, 2);
  const ind=document.getElementById(uid+'_exp_saved');
  if(ind){ind.textContent='↩ đã reset';setTimeout(()=>ind.textContent='',2000);}
}

function _getExpected(uid) {
  const tcKey=TC_UID_MAP[uid];
  const saved=localStorage.getItem('tc_expected_'+tcKey);
  if(saved) { try { return JSON.parse(saved); } catch(e) {} }
  return TEST_CASES[tcKey]?.expected||{};
}

function copyPayload(uid) {
  const tc=TEST_CASES[TC_UID_MAP[uid]]; if(!tc) return;
  const desc=document.getElementById(uid+'_txt').value;
  const payload={room:{key:tc.roomKey,name:tc.roomName,polygons:tc.polygons},
    walls:tc.walls,openings:tc.objects,source_unit:'m',description:desc,style:'modern'};
  navigator.clipboard.writeText(JSON.stringify(payload,null,2))
    .then(()=>{const b=document.getElementById(uid+'_copy');b.textContent='✅ Đã copy';setTimeout(()=>b.textContent='📋 Copy payload',1500);})
    .catch(()=>alert(JSON.stringify(payload,null,2)));
}

function _renderMetrics(m) {
  const pct = v => v===null||v===undefined ? 'N/A' : v+'%';
  const bar = (v, hi) => {
    if(v===null||v===undefined) return '';
    const color = v>=90?'#4caf50':v>=70?'#ff9800':'#f44336';
    return `<div style="height:4px;border-radius:2px;background:#eee;margin:2px 0 4px"><div style="width:${Math.min(100,v)}%;height:100%;background:${color};border-radius:2px"></div></div>`;
  };
  const rows = [
    ['📦 Đủ loại đồ', pct(m.type_coverage_pct), bar(m.type_coverage_pct)],
    ['📏 Sai lệch kích thước', m.size_deviation_pct===null?'N/A':pct(m.size_deviation_pct), ''],
    ['🚫 Ra ngoài biên', m.out_of_bounds_count+' vật', ''],
    ['⚠️ Chồng lấn', m.overlap_count+' cặp', ''],
    ['📋 Request following', pct(m.request_following)+` (${m.checks_passed}/${m.checks_total})`, bar(m.request_following)],
  ];
  const table = rows.map(([lbl,val,b])=>`<tr><td style="color:#888;padding:1px 6px 1px 0;white-space:nowrap">${lbl}</td><td style="font-weight:600;color:#333">${val}</td></tr>${b?`<tr><td colspan="2">${b}</td></tr>`:''}`).join('');
  const failed = (m.checks||[]).filter(c=>!c.pass).map(c=>`<span style="color:#c62828">✗ ${c.label}</span>`).join('<br>');
  return `<div class="tc-metrics"><table style="width:100%;border-collapse:collapse;font-size:9px">${table}</table>${failed?`<div style="margin-top:4px;font-size:8px;line-height:1.6">${failed}</div>`:''}</div>`;
}

async function runPipeline(uid) {
  const tc=TEST_CASES[TC_UID_MAP[uid]]; if(!tc) return;
  const desc=document.getElementById(uid+'_txt').value;
  const resEl=document.getElementById(uid+'_res');
  const runBtn=document.getElementById(uid+'_run');
  runBtn.disabled=true;
  resEl.className='tc-result show busy'; resEl.textContent='⏳ Submitting...';
  const payload={room:{key:tc.roomKey,name:tc.roomName,polygons:tc.polygons},
    walls:tc.walls,openings:tc.objects,source_unit:'m',description:desc,style:'modern'};
  try {
    const jr=await fetch('http://localhost:8000/pipeline/normalize-run',
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const job=await jr.json(); const jobId=job.id;
    if(!jobId) throw new Error(JSON.stringify(job));
    resEl.textContent=`⏳ Job queued (${jobId.slice(-8)})`;
    const deadline=Date.now()+300000;
    while(Date.now()<deadline) {
      await new Promise(r=>setTimeout(r,3000));
      const sr=await fetch(`http://localhost:8000/pipeline/normalize-run/${jobId}/status`);
      const st=await sr.json(); const state=(st.status||'').toLowerCase();
      resEl.textContent=`⏳ ${state} (${jobId.slice(-8)})`;
      if(state==='ready') {
        resEl.className='tc-result show busy'; resEl.textContent='⏳ Tính metrics...';
        const mr=await fetch(`http://localhost:8000/pipeline/normalize-run/${jobId}/metrics`,
          {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(_getExpected(uid))});
        if(mr.ok) {
          const metrics=await mr.json();
          resEl.className='tc-result show ok';
          resEl.innerHTML=`✅ Job ${jobId.slice(-8)}<br>${_renderMetrics(metrics)}`;
        } else {
          resEl.className='tc-result show ok';
          resEl.textContent=`✅ Done (metrics unavailable: ${mr.status})`;
        }
        runBtn.disabled=false; return;
      }
      if(state==='error') {
        resEl.className='tc-result show err';
        resEl.textContent=`❌ ${JSON.stringify(st.error||st)}`;
        runBtn.disabled=false; return;
      }
    }
    resEl.className='tc-result show err'; resEl.textContent='⏰ Timeout 5 phút';
  } catch(e) {
    resEl.className='tc-result show err'; resEl.textContent=`❌ ${e.message}`;
  }
  runBtn.disabled=false;
}

function render() {
  const main=document.getElementById('main');
  const sinhHoatCards=[], nguCards=[];
  const seenKeys=new Set();

  for(const d of DATA.designs){
    if(activeBld&&d.buildingId!==activeBld) continue;
    for(const r of d.rooms){
      const type=classifyRoom(r.name,d.name);
      if(activeType&&type!==activeType) continue;
      if(type==='other') continue;
      const k=polyKey(r.polygons);
      if(seenKeys.has(k)) continue;
      seenKeys.add(k);
      const dupCount=DUP_MAP[type+'|'+k]||1;
      const card=makeCard(r,d,dupCount);
      if(type==='sinh_hoat') sinhHoatCards.push(card);
      else if(type==='ngu') nguCards.push(card);
    }
  }

  let html='';
  if(sinhHoatCards.length===0&&nguCards.length===0){
    html='<div class="empty">Không tìm thấy phòng nào</div>';
  } else {
    if((!activeType||activeType==='sinh_hoat')&&sinhHoatCards.length>0){
      html+=`<div class="group-row"><div class="group-title">🛋️ Sinh hoạt (Khách + Bếp) <span class="group-count">${sinhHoatCards.length} case</span></div></div>`;
      html+=`<div class="grid">${sinhHoatCards.join('')}</div>`;
    }
    if((!activeType||activeType==='ngu')&&nguCards.length>0){
      if(html) html+='<div style="height:20px"></div>';
      html+=`<div class="group-row"><div class="group-title">🛏️ Phòng ngủ <span class="group-count">${nguCards.length} case</span></div></div>`;
      html+=`<div class="grid">${nguCards.join('')}</div>`;
    }
  }

  main.innerHTML=html;
  updateStats();
}

function updateStats() {
  const sinh=countUnique('sinh_hoat'), ngu=countUnique('ngu');
  const total=sinh+ngu;
  document.getElementById('stats').innerHTML=`
    <b>${total}</b> phòng hiển thị<br>
    <b>${sinh}</b> phòng sinh hoạt · <b>${ngu}</b> phòng ngủ
  `;
}

// Init building filter
const bldSel=document.getElementById('bldFilter');
DATA.buildings.forEach(b=>{
  const opt=document.createElement('option');
  opt.value=b.id; opt.textContent=b.name;
  bldSel.appendChild(opt);
});
bldSel.addEventListener('change',()=>{activeBld=bldSel.value;render();});

// Type buttons
document.querySelectorAll('.type-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeType=btn.dataset.t;
    render();
  });
});

render();
